type Query {
  """
  ログイン中の管理者（管理者でなければ null）
  """
  adminMe: User

  """
  統計（ユーザー数・単語数など。管理者専用）
  """
  adminStats: AdminStats!

  """
  ユーザー一覧（管理者専用・キーワード検索/並び替え/ページング対応）
  """
  adminUsers(
    """
    名前・メールの部分一致検索（大小無視・前後空白は無視）
    """
    keyword: String

    """
    1 始まりのページ番号
    """
    page: Int = 1

    """
    1 ページの件数（1〜100 にクランプ）
    """
    perPage: Int = 20

    """
    並び替えの基準（既定：登録日）
    """
    sortBy: AdminUserSortField = CREATED_AT

    """
    並び順（既定：降順）
    """
    sortOrder: SortOrder = DESC
  ): AdminUsersResult!

  """
  公式単語帳 1 件（教材なら章、章なら単語まで。管理者専用）
  """
  adminWordbook(id: ID!): Wordbook

  """
  公式単語帳の教材一覧（管理者専用・論理削除を除く）
  """
  adminWordbooks: [Wordbook!]!

  """
  API 稼働確認用
  """
  health: String!

  """
  ログイン中の一般ユーザー（未認証なら null）
  """
  me: User

  """
  自作単語帳 1 件（単語まで。本人以外・公式・論理削除済みは null）
  """
  myWordbook(id: ID!): Wordbook

  """
  自作単語帳の一覧（本人の personal のみ・論理削除を除く・要ログイン）
  """
  myWordbooks: [Wordbook!]!

  """
  公式単語帳の親 1 件（子＝章・単語まで。読み取り専用・要ログイン）
  """
  publicWordbook(id: ID!): Wordbook

  """
  公式単語帳の親一覧（読み取り専用・要ログイン）
  """
  publicWordbooks: [Wordbook!]!

  """
  学習記録の月別一覧（カレンダー用・study_details 込み・要ログイン）
  """
  studyRecords(
    """
    対象の月（1〜12）
    """
    month: Int!

    """
    対象の年（例 2026）
    """
    year: Int!
  ): [StudyRecord!]!

  """
  直近の学習記録一覧（新しい日付順・最大 30 件・要ログイン）
  """
  studyRecordsRecent: [StudyRecord!]!

  """
  学習記録の週別一覧（startDate から 7 日分・要ログイン）
  """
  studyRecordsWeek(
    """
    週の開始日（この日を含む 7 日分を返す）
    """
    startDate: ISO8601Date!
  ): [StudyRecord!]!

  """
  復習タグ付きの単語一覧（本人のみ・タグ付けの新しい順・要ログイン）
  """
  taggedWords: [Word!]!

  """
  今日の一問（公式単語からランダム 1 件・要ログイン。公式単語が無ければ null）
  """
  todayWord: Word

  """
  公式単語帳（親）の章ごとの解放状態（本人のみ・先頭章は遅延作成・要ログイン）
  """
  wordbookProgresses(
    """
    公式単語帳の親 ID（この教材の章の解放状態を返す）
    """
    wordbookId: ID!
  ): [WordbookProgress!]!
}

